# ============================================================================
# MantrixFlow — Docker Compose (local / staging only)
# Production: AWS ECS — see apps/mantrixflow-infra/DEPLOYMENT.md
# ============================================================================
#
# Directory layout on server:
#   server/
#   ├── docker-compose.prod.yml    ← this file
#   ├── .env.production            ← your env vars (copy from .env.production.example)
#   ├── main-server/               ← clone of mantrixflow-api repo
#   │   ├── Dockerfile             ← included here OR in the repo
#   │   ├── cmd/
#   │   ├── internal/
#   │   └── ...
#   └── etl-server/                ← clone of mantrixflow-etl repo
#       ├── Dockerfile             ← included here OR in the repo
#       ├── api/
#       ├── core/
#       └── ...
#
# Setup:
#   cd server/
#   git clone git@github.com:yourorg/mantrixflow-api.git main-server
#   git clone git@github.com:yourorg/mantrixflow-etl.git etl-server
#   cp .env.production.example .env.production   # fill in values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# ============================================================================

services:
  # ── Go API Server ─────────────────────────────────────────
  api:
    build:
      context: ./main-server
      dockerfile: Dockerfile
    image: mantrixflow/api:latest
    container_name: mantrixflow-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    env_file:
      - .env.production
    environment:
      - PORT=5000
      - ETL_PYTHON_SERVICE_URL=http://etl:8000
      - API_PUBLIC_URL=${API_PUBLIC_URL}
      # Rate limiting (per IP, per minute) — tuned for 4 vCPU shared
      - RATE_LIMIT_GENERAL_MAX=${RATE_LIMIT_GENERAL_MAX:-200}
      - RATE_LIMIT_SYNC_MAX=${RATE_LIMIT_SYNC_MAX:-10}
      - RATE_LIMIT_AUTH_MAX=${RATE_LIMIT_AUTH_MAX:-20}
      # Worker concurrency — 2 parallel dispatch goroutines max
      - PGMQ_PARALLEL_WORKERS=${PGMQ_PARALLEL_WORKERS:-2}
      - PGMQ_POLL_INTERVAL_MS=${PGMQ_POLL_INTERVAL_MS:-3000}
      # Pipeline execution limits (MVP)
      - PIPELINE_MAX_CONCURRENT=${PIPELINE_MAX_CONCURRENT:-4}
      - PIPELINE_MAX_PER_HOUR=${PIPELINE_MAX_PER_HOUR:-24}
      - PIPELINE_MAX_PER_DAY=${PIPELINE_MAX_PER_DAY:-500}
      - PIPELINE_MAX_PER_ORG_CONCURRENT=${PIPELINE_MAX_PER_ORG_CONCURRENT:-2}
      - PIPELINE_MAX_PER_ORG_PER_HOUR=${PIPELINE_MAX_PER_ORG_PER_HOUR:-12}
    networks:
      - mantrixflow-internal
    depends_on:
      etl:
        condition: service_healthy
    # Resource budget for 4 vCPU / 8 GB shared server:
    #   OS + Docker overhead : ~0.5 CPU, ~1 GB
    #   Go API              : 1.0 CPU, 512 MB (Fiber is lean; handles CRUD + JWT + proxying)
    #   ETL                 : 2.0 CPU, 4 GB   (dlt pipelines are CPU/RAM heavy)
    #   Reserve             : 0.5 CPU, 2.5 GB (connection spikes, OS cache)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 64M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Python ETL Server (dlt) ──────────────────────────────
  etl:
    build:
      context: ./etl-server
      dockerfile: Dockerfile
    image: mantrixflow/etl:latest
    container_name: mantrixflow-etl
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - CALLBACK_URL=http://api:5000/api/v1/internal/etl-callback
      - MAX_CONCURRENT_RUNS=${MAX_CONCURRENT_RUNS:-2}
      - MAX_TAPS_PER_SOURCE=${MAX_TAPS_PER_SOURCE:-2}
      - DEFAULT_SYNC_TIMEOUT_SECONDS=${DEFAULT_SYNC_TIMEOUT_SECONDS:-300}
    volumes:
      - etl-dlt-data:/tmp/dlt-pipelines
    networks:
      - mantrixflow-internal
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  mantrixflow-internal:
    driver: bridge
    name: mantrixflow-internal

volumes:
  etl-dlt-data:
    driver: local
    name: mantrixflow-etl-dlt-data
