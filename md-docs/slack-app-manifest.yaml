display_information:
  name: MantrixFlow
  description: Pipeline alerts and simple data operations from Slack.
  long_description: MantrixFlow sends pipeline lifecycle alerts to Slack and lets mapped users list, check, run, and pause pipelines with lightweight slash commands. The app uses OAuth, stores installed Slack secrets encrypted in MantrixFlow, and keeps complex data work in the web app.
  background_color: "#111827"
features:
  bot_user:
    display_name: MantrixFlow
    always_online: false
  slash_commands:
    - command: /pipeline
      description: List, check, run, or pause MantrixFlow pipelines.
      usage_hint: list | status <name-or-id> | run <name-or-id> | pause <name-or-id>
      should_escape: false
      url: https://YOUR_APP_HOST/api/slack/commands
    - command: /connection
      description: List or test MantrixFlow connections.
      usage_hint: list | test <name-or-id>
      should_escape: false
      url: https://YOUR_APP_HOST/api/slack/commands
    - command: /mantrixflow
      description: Link your Slack user to MantrixFlow.
      usage_hint: link | help
      should_escape: false
      url: https://YOUR_APP_HOST/api/slack/commands
oauth_config:
  redirect_urls:
    - https://YOUR_APP_HOST/api/slack/oauth/callback
  scopes:
    bot:
      - commands
      - chat:write
      - incoming-webhook
      - users:read
      - users:read.email
    bot_optional:
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
    request_url: https://YOUR_APP_HOST/api/slack/actions
  event_subscriptions:
    request_url: https://YOUR_APP_HOST/api/slack/events
    bot_events:
      - app_uninstalled
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
