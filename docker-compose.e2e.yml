services:
  postgres-e2e-source:
    image: postgres:16-alpine
    container_name: postgres-e2e-source
    environment:
      POSTGRES_DB: mantrixflow_e2e_source
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mantrixflow_e2e_source"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-e2e-destination:
    image: postgres:16-alpine
    container_name: postgres-e2e-destination
    environment:
      POSTGRES_DB: mantrixflow_e2e_destination
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mantrixflow_e2e_destination"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped
