name: Playwright complete workflow

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

concurrency:
  group: mantrixflow-playwright-workflow
  cancel-in-progress: false

jobs:
  workflow-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/app
    env:
      CI: "true"
      E2E_START_SERVERS: "1"
      NEXT_PUBLIC_ALLOW_E2E_DB_MUTATIONS: "true"
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      ENVIRONMENT: test
      DATABASE_URL: ${{ secrets.E2E_APP_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.E2E_SUPABASE_JWT_SECRET }}
      ENCRYPTION_MASTER_KEY: ${{ secrets.E2E_ENCRYPTION_MASTER_KEY }}
      ELT_INTERNAL_TOKEN: ${{ secrets.E2E_ELT_INTERNAL_TOKEN }}
      CALLBACK_TOKEN: ${{ secrets.E2E_CALLBACK_TOKEN }}
      INTERNAL_TOKEN: ${{ secrets.E2E_INTERNAL_TOKEN }}
      ELT_PYTHON_SERVICE_URL: http://localhost:8000
      ALLOW_SOURCE_DB_MUTATIONS: "true"
      E2E_LOGIN_EMAIL: ${{ secrets.E2E_LOGIN_EMAIL }}
      E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
      E2E_POSTGRES_SOURCE_JSON: ${{ secrets.E2E_POSTGRES_SOURCE_JSON }}
      E2E_POSTGRES_DESTINATION_JSON: ${{ secrets.E2E_POSTGRES_DESTINATION_JSON }}
      E2E_HUBSPOT_JSON: ${{ secrets.E2E_HUBSPOT_JSON }}
      E2E_STRIPE_JSON: ${{ secrets.E2E_STRIPE_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/main-server/go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Install ELT dependencies
        working-directory: apps/server/elt-server
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run complete UI workflow
        run: bun run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-workflow-evidence
          path: |
            apps/app/.playwright/report
            apps/app/.playwright/results
          retention-days: 14
